<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Bad Guy</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #f59e0b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #1f2937);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: min(90vw, 720px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        padding: 48px 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .badge {
        display: inline-block;
        color: var(--accent);
        background: rgba(245, 158, 11, 0.08);
        border: 1px solid rgba(245, 158, 11, 0.4);
        border-radius: 999px;
        padding: 8px 14px;
        letter-spacing: 0.08em;
        font-size: 12px;
        text-transform: uppercase;
        font-weight: bold;
      }

      h1 {
        margin: 22px 0 12px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0 auto;
        max-width: 560px;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .button {
        display: inline-block;
        margin-top: 28px;
        padding: 14px 24px;
        background: var(--accent);
        color: #111827;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Launch Ready</div>
      <h1>Website Bad Guy</h1>
      <p>
        A simple, clean landing page for a new project. This is the basic homepage for the
        duplicated website setup.
      </p>
      <a class="button" href="#">Get Started</a>
    </main>
  </body>
</html>
